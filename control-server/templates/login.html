<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">
    <title>{{ brand.name }} — Sign in</title>
    <style>
        @import url("/static/fonts/fonts.css");

        :root {
            --ink:           #0a0a0a;
            --ink-1:         #0f0f0f;
            --paper:         #f1f1ee;
            --paper-60:      rgba(241, 241, 238, 0.64);
            --paper-80:      rgba(241, 241, 238, 0.82);
            --rule-strong:   rgba(241, 241, 238, 0.16);
            --amber-tungsten:      #ff6a1f;
            --on-accent:      #0a0a0a;
            --amber-tungsten-glow: color-mix(in srgb, var(--amber-tungsten) 32%, transparent);
            --signal-red:    #f87171;
            --signal-red-deep: #7a2020;
            --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--ink); color: var(--paper);
            font-family: var(--font-sans); font-size: 1rem;
            -webkit-font-smoothing: antialiased;
            padding: 1rem;
        }

        .card {
            width: 100%; max-width: 360px;
            background: var(--ink-1); border: 1px solid var(--rule-strong);
            padding: 2rem 1.75rem;
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
        .logo-icon { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
        .swatch-mark {
            display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
            width: 34px; height: 18px; flex-shrink: 0;
        }
        .swatch-mark > span { display: block; }
        h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }

        label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--paper-80); margin-bottom: 0.4rem; }

        input[type="password"] {
            width: 100%; min-height: 48px; padding: 0 0.85rem; margin-bottom: 1rem;
            background: var(--ink); border: 1px solid var(--rule-strong); border-radius: 0;
            color: var(--paper); font-size: 1rem; font-family: var(--font-sans);
        }
        input[type="password"]:focus { outline: none; border-color: var(--amber-tungsten); box-shadow: 0 0 0 1px var(--amber-tungsten); }

        .remember {
            display: flex; align-items: center; gap: 0.6rem; min-height: 44px; margin-bottom: 1rem;
            font-size: 0.9375rem; color: var(--paper-60); font-weight: 400;
        }
        .remember input { accent-color: var(--amber-tungsten); width: 18px; height: 18px; }

        button {
            width: 100%; min-height: 48px; border: none; border-radius: 0;
            background: var(--amber-tungsten); color: var(--on-accent);
            font-family: var(--font-sans); font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: background 0.15s;
        }
        button:hover { background: var(--paper); }

        .error {
            border: 1px solid var(--signal-red-deep); color: var(--signal-red);
            font-size: 0.9375rem; padding: 0.65rem 0.75rem; margin-bottom: 1rem;
        }
    </style>
    <style>:root { --amber-tungsten: {{ brand.accent }}; --on-accent: {{ brand.on_accent }}; }</style>
    {% if has_theme_css %}<link rel="stylesheet" href="/theme.css">{% endif %}
</head>
<body>
    <div class="card">
        <div class="brand">
            <img class="logo-icon" src="/logo" alt=""
                 onerror="this.style.display='none';this.nextElementSibling.style.display='';" />
            <span class="swatch-mark" style="display:none" aria-hidden="true"><span style="background:#ff3c00"></span><span style="background:#ffff57"></span><span style="background:#ff3c00"></span><span style="background:#ff3c00"></span><span style="background:#dc1e50"></span><span style="background:#ff3c00"></span><span style="background:#dc1e50"></span><span style="background:#dc1e50"></span></span>
            <h1>{{ brand.name }}</h1>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autofocus required>
            <label class="remember">
                <input type="checkbox" name="remember" value="1">
                Remember me for 30 days
            </label>
            <button type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
